name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir _site
          cp rotating-field-machine.html _site/index.html
          cp rotating-field-machine.html _site/rotating-field-machine.html
          cp delta-wye-transformer.html _site/delta-wye-transformer.html
          cp overhead-line-inductance.html _site/overhead-line-inductance.html
          build_hash="$(git rev-parse --short=7 HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i "s/__BUILD_HASH__/${build_hash}/g; s/__BUILD_TIME__/${build_time}/g" _site/index.html _site/rotating-field-machine.html _site/delta-wye-transformer.html _site/overhead-line-inductance.html
          cp xr-controls.js _site/xr-controls.js
          cp field-kernels.js _site/field-kernels.js
          cp transformer-model.js _site/transformer-model.js
          cp -R vendor _site/vendor
          cp LICENSE _site/LICENSE
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
